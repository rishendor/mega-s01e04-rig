name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      with_marker:
        description: Include the lane banner value (false needs separate replacement approval)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: digest-preview-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rishendor/mega-s01e04-rig' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.verify.outputs.url }}
    outputs:
      preview_url: ${{ steps.verify.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Install locked dependencies without the lane secret
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile

      - name: Test and check types before secret exposure
        run: |
          pnpm test
          pnpm typecheck
          node --test scripts/check-export-preview.mjs
          test ! -e .env
          printf '%s\n' '1a04213e3bf5921e40764080788b8df168d4a9b783c27784a5a6ea8a2cffd20a  runs/2026-10-28.jsonl' | sha256sum --check --status
          node --input-type=module -e "import { readFileSync } from 'node:fs'; if (JSON.parse(readFileSync('rig.json', 'utf8')).runsDir !== 'runs') process.exit(1);"

      - name: Generate the single HTML file outside the checkout
        env:
          WITH_MARKER: ${{ inputs.with_marker }}
          LANE_MARKER: ${{ inputs.with_marker && secrets.LANE_MARKER || '' }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$WITH_MARKER" == 'true' ]]; then
            node -e "if (!process.env.LANE_MARKER?.trim()) { console.error('A nonempty lane secret is required.'); process.exit(1); }"
          elif [[ "$WITH_MARKER" == 'false' ]]; then
            unset LANE_MARKER
          else
            exit 1
          fi
          test ! -e .env
          export PORT=8787 LANE_ID=lane-07
          mkdir "$RUNNER_TEMP/rig-preview"
          node --import tsx src/server.ts > "$RUNNER_TEMP/rig-preview-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            kill -0 "$server_pid"
            if curl --silent --fail --output /dev/null http://127.0.0.1:8787/digest/2026-10-28; then
              break
            fi
            sleep 1
          done
          node scripts/export-preview.mjs --output "$RUNNER_TEMP/rig-preview/index.html"
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/rig-preview`;
          const html = readFileSync(`${directory}/index.html`, 'utf8');
          const escape = (value) => value.replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
          })[char]);
          const banner = process.env.WITH_MARKER === 'true'
            ? escape(process.env.LANE_MARKER.trim()) : 'no marker set';
          if (!html.includes(`<span class="marker">${banner}</span>`)
              || /<script\b|<(?:link|img|iframe|object|embed)\b|\b(?:src|href)\s*=|@import|url\s*\(/i.test(html)
              || readdirSync(directory).join() !== 'index.html') {
            throw new Error('Preview must contain the expected banner and only self-contained HTML.');
          }
          NODE

      - name: Upload temporary Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: digest-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1

      - name: Deploy and wait for completion
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: digest-preview-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the exact temporary artifact and verify absence
        id: cleanup
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: digest-preview-${{ github.run_id }}-${{ github.run_attempt }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          debug: false
          script: |
            const scope = { ...context.repo };
            const headers = { 'X-GitHub-Api-Version': '2022-11-28' };
            let id = process.env.ARTIFACT_ID;
            // A failed/interrupted upload can have created an artifact without setting its output.
            if (!id && ['success', 'failure', 'cancelled'].includes(process.env.UPLOAD_OUTCOME)) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...scope, run_id: context.runId, per_page: 100, headers,
              });
              const matches = artifacts.filter((item) => item.name === process.env.ARTIFACT_NAME);
              if (matches.length > 1) throw new Error('Ambiguous artifact; manual recovery required.');
              id = matches[0]?.id?.toString();
              if (!id && process.env.UPLOAD_OUTCOME === 'success') {
                throw new Error('Successful upload has no verifiable artifact ID.');
              }
            }
            if (!id) return;
            if (!/^\d+$/.test(id) || !Number.isSafeInteger(Number(id))) {
              throw new Error('Invalid artifact ID; manual recovery required.');
            }
            const params = { ...scope, artifact_id: Number(id), headers };
            try {
              const { data } = await github.rest.actions.getArtifact(params);
              if (data.name !== process.env.ARTIFACT_NAME || data.workflow_run?.id !== context.runId) {
                throw new Error('Artifact is not this run\'s preview; refusing deletion.');
              }
              const deleted = await github.rest.actions.deleteArtifact(params);
              if (deleted.status !== 204) throw new Error('Artifact deletion was not acknowledged.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.actions.getArtifact(params);
              throw new Error('Artifact still exists after deletion.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`Temporary artifact ${id} is absent (GET 404).`);

      - name: Verify the production page after artifact deletion
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const url = new URL(process.env.PAGE_URL);
          if (url.href !== 'https://rishendor.github.io/mega-s01e04-rig/') {
            throw new Error('Unexpected production URL; check Pages configuration.');
          }
          const expected = readFileSync(`${process.env.RUNNER_TEMP}/rig-preview/index.html`);
          let matches = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(10_000) });
              matches = response.ok && /^text\/html(?:;|$)/i.test(response.headers.get('content-type') ?? '')
                && expected.equals(Buffer.from(await response.arrayBuffer()));
              if (matches) break;
            } catch { /* Allow bounded Pages/CDN propagation; never print the response body. */ }
            if (attempt < 11) await setTimeout(5_000);
          }
          if (!matches) throw new Error('Production HTML does not match the exported file after artifact deletion.');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.href}\n`);
          console.log(url.href);
          NODE
